##                 CBU                  ##
##                                      ##
##              |CSN IO19|              ##
##                                      ##
##  |P14|          |#|            |P15| ##
##  |P16|          |#|            |P17| ##
##  |P20| relay_3  |#|            | P9| ##
##  |P22| relay_2  |#|   CEN      |CEN| ##
##  |ADC| 17       |#|            |P28| ##
##  |RX2| 28       |#| bl0942 P10 |RX1| ##
##  |TX2| 29       |#| bl0942 P11 |TX1| ## 
##--------------------------------------##
##|P8| |P7| |P6| |P26| |P24| |GND| |3V3|##
##  R   R     L    R      B             ##
##  e   e     e    e      u             ##
##  l   l     d    l      t             ##
