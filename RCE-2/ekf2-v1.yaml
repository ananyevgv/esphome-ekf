##########################################
##               TYWE3S                 ##
##  |RS|          |#|     |tx| led2     ##
##  |adc|         |#|     |rx|  rele4   ##
##  |en|          |#|     | 5|  cf1     ##
##  |16| button   |#|     | 4|  cf      ##
##  |14| rele3    |#|     | 0|          ##
##  |12| sel      |#|     | 2|          ##
##  |13| rele2    |#|     |15|  rele1   ## 
##  |3V|          |#|     |GN|          ##
##########################################

substitutions:
  name: "ekf2-v1"
  device_description: EKF Wi-Fi PRO Connect RCE-2-WF v1
  room: "holl"

esphome:
  on_boot:
    then:
      - script.execute: check_relays_state

esp32:
  board: esp32-c3-devkitm-1
  variant: Esp32C3
  framework:
    type: esp-idf

#-------------------------------------------
# Packages
#------------------------------------------- 
packages:
  wifi: !include packages/wifi.yaml
  device_base: !include packages/device_base.yaml



#-------------------------------------------
#  GLOBAL
#-------------------------------------------   
globals:
  - id: is_relays_on
    type: bool
    restore_value: no
    initial_value: "false"

#-------------------------------------------
#  LIGHT
#-------------------------------------------   
light:
  - platform: status_led
    id: wifi_led
    pin:
      number: 21 #P6
      inverted: true
    internal: false

#-------------------------------------------
#  SWITCH
#-------------------------------------------   
switch:
  - platform: gpio
    id: relay_1
    name: "TV"
    icon: mdi:television #icon: mdi:power-socket-eu
    pin: 7 #P7
    on_turn_on:
      - script.execute: check_relays_state
    on_turn_off:
      - script.execute: check_relays_state
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: relay_2
    name: "DVD"
    icon: mdi:disc-player #icon: mdi:power-socket-eu
    pin: 6
    on_turn_on:
      - script.execute: check_relays_state
    on_turn_off:
      - script.execute: check_relays_state
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: relay_3
    name: "ТВ приставка"
    icon: mdi:set-top-box #icon: mdi:power-socket-eu
    pin: 4 
    on_turn_on:
      - script.execute: check_relays_state
    on_turn_off:
      - script.execute: check_relays_state
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: relay_4
    name: "Розетка 4"
    icon: mdi:power-socket-eu
    pin: 20
    on_turn_on:
      - script.execute: check_relays_state
    on_turn_off:
      - script.execute: check_relays_state
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: relay_5
    name: "USB"
    icon: mdi:usb
    pin: 
      number: 8
      inverted: True
    on_turn_on:
      - script.execute: check_relays_state
    on_turn_off:
      - script.execute: check_relays_state
    restore_mode: RESTORE_DEFAULT_OFF

#-------------------------------------------
#  BINARY_SENSOR
#-------------------------------------------   
binary_sensor:
  - platform: gpio
    id: toggle_relays
    name: toggle_elays
    device_class: plug
    internal: true
    pin:
      number: 2
      inverted: true
      mode: INPUT_PULLDOWN
    filters:
      - delayed_off: 10ms
    on_multi_click:
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.5s
        then:
          - lambda: |-  
              id(relays_toggle).execute();
      - timing:
          - ON for at least 1s
        then:
          - lambda: |-  
              if (id(is_relays_on) == true) {
                id(off_relays).execute();
              } else {
                id(on_relays).execute();
              }
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.5s
          - ON for at most 0.5s
          - OFF for at least 0.5s
        then:
          - lambda: |-  
              id(off_relays).execute();

  - platform: analog_threshold
    name: "current overload"
    sensor_id: current
    device_class: problem
    threshold: 16
    id: current_overload
    on_press:
      then:
        - switch.turn_off: relay_1
        - switch.turn_off: relay_2
        - switch.turn_off: relay_3
        - switch.turn_off: relay_4
        - switch.turn_off: relay_5

  - platform: analog_threshold
    name: "voltage overload"
    sensor_id: voltage
    device_class: problem
    threshold: 253
    id: voltage_overload
    on_press:
      then:
        - switch.turn_off: relay_1
        - switch.turn_off: relay_2
        - switch.turn_off: relay_3
        - switch.turn_off: relay_4
        - switch.turn_off: relay_5

#-------------------------------------------
#  SCRIPT
#-------------------------------------------   
script:
  - id: on_relays
    then:
      - switch.turn_on: relay_1
      - delay: 30ms
      - switch.turn_on: relay_2
      - delay: 30ms
      - switch.turn_on: relay_3
      - delay: 30ms
      - switch.turn_on: relay_4
      - delay: 30ms
      - switch.turn_on: relay_5
      - delay: 30ms
      - light.turn_on: wifi_led
  - id: off_relays
    then:
      - switch.turn_off: relay_1
      - delay: 30ms
      - switch.turn_off: relay_2
      - delay: 30ms
      - switch.turn_off: relay_3
      - delay: 30ms
      - switch.turn_off: relay_4
      - delay: 30ms
      - switch.turn_off: relay_5
      - delay: 30ms
      - light.turn_off: wifi_led
  - id: check_relays_state
    then:
      - if:
          condition:
            or:
              - switch.is_on: relay_1
              - switch.is_on: relay_2
              - switch.is_on: relay_3
              - switch.is_on: relay_4
              - switch.is_on: relay_5
          then:
            - lambda: "id(is_relays_on) = true;"
            - light.turn_on: wifi_led
          else:
            - lambda: "id(is_relays_on) = false;"
            - light.turn_off: wifi_led
            
  - id: relays_toggle
    then:
      - if:
          condition:
            and:
              - switch.is_off: relay_1
              - switch.is_off: relay_2
              - switch.is_off: relay_3
              - switch.is_off: relay_4
              - switch.is_off: relay_5
          then:
            - switch.turn_on: relay_1
            - lambda: "id(is_relays_on) = true;"
            - light.turn_on: wifi_led
          else:
            - if:
                condition:
                  and:
                    - switch.is_on: relay_1
                    - switch.is_off: relay_2
                    - switch.is_off: relay_3
                    - switch.is_off: relay_4
                    - switch.is_off: relay_5
                then:
                  - switch.turn_on: relay_2
                  - lambda: "id(is_relays_on) = true;"
                  - light.turn_on: wifi_led
                else:
                  - if:
                      condition:
                        and:
                          - switch.is_on: relay_1
                          - switch.is_on: relay_2
                          - switch.is_off: relay_3
                          - switch.is_off: relay_4
                          - switch.is_off: relay_5
                      then:
                        - switch.turn_on: relay_3
                        - lambda: "id(is_relays_on) = true;"
                        - light.turn_on: wifi_led
                      else:
                        - if:
                            condition:
                              and:
                                - switch.is_on: relay_1
                                - switch.is_on: relay_2
                                - switch.is_on: relay_3
                                - switch.is_off: relay_4
                                - switch.is_off: relay_5
                            then:
                              - switch.turn_on: relay_4
                              - lambda: "id(is_relays_on) = true;"
                              - light.turn_on: wifi_led
                            else:
                              - if:
                                  condition:
                                    and:
                                      - switch.is_on: relay_1
                                      - switch.is_on: relay_2
                                      - switch.is_on: relay_3
                                      - switch.is_on: relay_4
                                      - switch.is_off: relay_5
                                  then:
                                    - switch.turn_on: relay_5
                                    - lambda: "id(is_relays_on) = true;"
                                    - light.turn_on: wifi_led
                                  else:
                                    - switch.turn_off: relay_1
                                    - switch.turn_off: relay_2
                                    - switch.turn_off: relay_3
                                    - switch.turn_off: relay_4
                                    - switch.turn_off: relay_5
                                    - lambda: "id(is_relays_on) = false;"
                                    - light.turn_off: wifi_led

#-------------------------------------------
#  BUTTON
#-------------------------------------------   
button:
  - platform: template
    id: toggle_relays_btn
    name: "Toggle"
    icon: mdi:toggle-switch
    on_press:
      then:
        - lambda: |-  
            if (id(is_relays_on) == true) {
              id(off_relays).execute();
            } else {
              id(on_relays).execute();
            }
             
#-------------------------------------------
#  SENSOR
#-------------------------------------------   
sensor:    
  - platform: hlw8012
    sel_pin: 
      number: GPIO5
      inverted: true
    cf_pin: GPIO10
    cf1_pin: GPIO3
    current:
      name: "current"
      id: current
      filters:
        - multiply: 0.6744186046511628   
    voltage:
      name: "voltage"
      id: voltage    
      filters:
        - multiply: 0.3419384758076983
    power:
      name: "power"
      filters:
        - multiply: 0.1610779674963999
    energy:
      name: "energy"
    update_interval: 1s  
    
